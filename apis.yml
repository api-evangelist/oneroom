name: OneRoom
description: OneRoom was an online-learning startup founded in 2014 in San Francisco
  by Scott Forman and Jeff Kolesky and backed by Bloomberg Beta's 2013 fund with a
  roughly $750K seed round. It operated joinoneroom.com as a marketplace of live,
  video-based writing courses (fiction, non-fiction, playwriting, poetry, and prose)
  taught in intimate online classrooms featuring break-outs, head-to-head debates,
  content sharing, and co-annotation. The company appears defunct — co-founder Jeff
  Kolesky departed in 2016, and its domain now 302-redirects to a domain-sale listing
  (hugedomains.com). No product, developer portal, documentation, or public API surface
  remains. This profile records the honest identity so the API Evangelist network
  does not re-research a dead portfolio lead.
